name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: src/backend/go.sum
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: go vet ./... && go test -race ./...
        working-directory: src/backend
      - run: |
          mkdir -p ../../.work
          go build -o ../../.work/typonamer .
          go build -o ../../.work/powerwhois ./cmd/powerwhois
          go build -o ../../.work/powerwhois-mcp ./cmd/powerwhois-mcp
        working-directory: src/backend
      - run: python3 tools/acceptance.py
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck ./...
        working-directory: src/backend
      - run: npm ci && npm test && npm run lint && npm run build && npm audit --omit=dev
        working-directory: src/frontend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Start a fresh installation and check the gateway
        working-directory: deploy
        run: |
          export POWERWHOIS_ADMIN_USER=smoke
          export POWERWHOIS_ADMIN_PASSWORD="$(openssl rand -hex 16)"
          export POWERWHOIS_JWT_SECRET="$(openssl rand -hex 32)"
          export POWERWHOIS_QUERY_TOKEN="$(openssl rand -hex 32)"
          export POWERWHOIS_CONFIG_DIR=./runtime/backend
          sudo install -d -o 10001 -g 10001 -m 750 "$POWERWHOIS_CONFIG_DIR"
          sudo install -o 10001 -g 10001 -m 600 backend/config.yaml "$POWERWHOIS_CONFIG_DIR/config.yaml"
          docker compose config --quiet
          docker compose up -d --build
          test "$(curl -fsS --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/healthz)" = ok
          curl -fsS http://127.0.0.1:8080/ | grep -qi PowerWhois
          curl -fsS http://127.0.0.1:8080/api/web/setting | jq -e '.webCheckDomainLimit > 0'
          base=http://127.0.0.1:8080
          curl -fsS "$base/tasks/example" | grep -qi PowerWhois
          curl -fsSI "$base/" | grep -iq '^X-Frame-Options: DENY'
          asset=$(curl -fsS "$base/" | grep -oE 'src="[^"]+\.js"' | head -1 | cut -d'"' -f2)
          test -n "$asset"
          curl -fsSI "$base$asset" | grep -iq '^Cache-Control: .*immutable'
          for path in /assets/missing.js /api /app; do
            test "$(curl -sS -o /dev/null -w '%{http_code}' "$base$path")" = 404
          done
