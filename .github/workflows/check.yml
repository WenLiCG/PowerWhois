name: Verify PowerWhois

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: src/backend/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.5'
      - name: Install tools for tests
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          npm install --global yarn@1.22.22
      - name: Test Go
        working-directory: src/backend
        run: |
          go vet ./...
          go test -race ./...
          # The scanner supports Go 1.26 source analysis. Release binaries are scanned below.
          GOTOOLCHAIN=go1.26.11 go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          GOTOOLCHAIN=go1.26.11 govulncheck ./...
      - name: Test and build frontend
        working-directory: src/frontend
        run: |
          yarn install --frozen-lockfile
          yarn lint
          yarn test
          yarn build
      - name: Package and scan
        run: |
          bash src/package.sh amd64
          bash src/package.sh arm64
          scratch=$(mktemp -d)
          for package in dist/*.tar.gz; do
            tar -xzf "$package" -C "$scratch"
            govulncheck -mode=binary "$scratch/deploy/backend/typonamer"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: PowerWhois-linux
          path: dist/PowerWhois-*
