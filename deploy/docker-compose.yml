services:
  caddy:
    build:
      context: ..
      target: gateway
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - typonamer
    restart: unless-stopped
    logging:
      options: { max-size: "10m", max-file: "3" }

  typonamer:
    build:
      context: ..
      target: backend
    volumes:
      # Mount the directory so atomic config replacement works.
      - ./backend:/etc/powerwhois
      - powerwhois-data:/var/lib/powerwhois
    environment:
      TZ: Asia/Shanghai
      REDIS_HOST: redis
      POWERWHOIS_LISTEN: "0.0.0.0:8080"
      POWERWHOIS_ADMIN_USER: "${POWERWHOIS_ADMIN_USER:?set administrator user}"
      POWERWHOIS_ADMIN_PASSWORD: "${POWERWHOIS_ADMIN_PASSWORD:?set administrator password}"
      POWERWHOIS_JWT_SECRET: "${POWERWHOIS_JWT_SECRET:?set random JWT secret}"
      POWERWHOIS_QUERY_TOKEN: "${POWERWHOIS_QUERY_TOKEN:?set random query token}"
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      options: { max-size: "10m", max-file: "3" }

volumes:
  powerwhois-data:
