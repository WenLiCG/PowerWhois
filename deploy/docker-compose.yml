services:
  caddy:
    image: caddy:2.11.9-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/typonamer:ro
    depends_on:
      - typonamer
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  typonamer:
    build: ./backend
    user: "${POWERWHOIS_UID:-1000}:${POWERWHOIS_GID:-1000}"
    volumes:
      - ./backend:/typonamer
    environment:
      TZ: Asia/Shanghai
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      POWERWHOIS_LISTEN: "0.0.0.0:8080"
      POWERWHOIS_ADMIN_PASSWORD: "${POWERWHOIS_ADMIN_PASSWORD:?set POWERWHOIS_ADMIN_PASSWORD}"
      POWERWHOIS_JWT_SECRET: "${POWERWHOIS_JWT_SECRET:?set POWERWHOIS_JWT_SECRET}"
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 20s
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7.4.12-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "5"
