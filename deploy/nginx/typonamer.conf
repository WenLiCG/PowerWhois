# Include in the http block, for example via /etc/nginx/conf.d.
map $http_upgrade $powerwhois_connection {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=powerwhois_login:10m rate=6r/m;

server {
    listen 443 ssl http2;
    server_name typonamer.example.com;

    ssl_certificate /etc/nginx/ssl/example.pem;
    ssl_certificate_key /etc/nginx/ssl/example.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 101m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $powerwhois_connection;
    proxy_read_timeout 180s;

    location = /api/login {
        limit_req zone=powerwhois_login burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}

server {
    listen 80;
    server_name typonamer.example.com;
    return 301 https://$host$request_uri;
}
