
# Setting the log level, available values are: Error, Warn, Info, Debug, Off
LogLevel: Info

# Setting authentication information
AuthUsername: admin
# Admin password and JWT secret are environment variables, not this file.
# POWERWHOIS_ADMIN_PASSWORD and POWERWHOIS_JWT_SECRET are required.
# Startup refuses if either one is missing. Changing the JWT secret invalidates issued tokens.
AuthExpireDays: 1

# ------ Common settings ------
## Setting whois parameters
WhoisTimeout: 6

## Setting DNS parameters
DnsTimeout: 5

## Setting retry parameters
RetryOnTimeout: true
RetryInterval: 3
RetryMax: 2

## The TLDs forced to go through proxy
GlobalProxyTlds:

## The TLDs forced to go through proxy in mixed query
MixedProxyTlds: []

## The TLDs forced to go through DNS check in mixed query
MixedDnsTlds:
    - cf
    - ga
    - gr
    - nz
    - ml
    - to
    - com.vn
    - vn
    - co.nz
    - tk
    - es
    - ac.uk
    - de
    - ch
    - pt

## Setting proxy information
SocketProxyHost: ""
SocketProxyPort: 0
SocketProxyAuth: false
SocketProxyUser: ""
SocketProxyPassword: ""

# ------ Bulk check settings ------
BulkCheckConcurrencyLimit: 15

# ------ Web check settings ------
WebCheckConcurrencyLimit: 15
WebCheckDomainLimit: 800
# Domains per minute for each anonymous public IP (1-100000). Loopback and private addresses are exempt.
PublicDomainsPerMinute: 800

# ------ Typo check settings ------
TypoDefaultCcTlds:
    - Tld: com
      IsSelected: true
    - Tld: net
      IsSelected: true
    - Tld: org
      IsSelected: true
    - Tld: co
      IsSelected: true
    - Tld: de
      IsSelected: false
    - Tld: eu
      IsSelected: false
    - Tld: in
      IsSelected: false

TypoCustomizedReplaces:
    - s2:ss22
    - sa:sal

# Add administrator-only provider templates here or through Settings.
RegisterApis: []
WhoisApis: []
