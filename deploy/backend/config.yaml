# Setting the log level, available values are: Error, Warn, Info, Debug, Off
LogLevel: Info

# Setting authentication information
AuthUsername: ""
AuthPassword: ""
AuthExpireDays: 30
JwtSecretKey: ""

# ------ Common settings ------
## Setting whois parameters
WhoisTimeout: 6

## Setting DNS parameters
DnsTimeout: 5

## Setting retry parameters
RetryOnTimeout: true
RetryInterval: 3
RetryMax: 2

## The TLDs forced to go through proxy
GlobalProxyTlds:

## The TLDs forced to go through proxy in mixed query
MixedProxyTlds:

## The TLDs forced to go through DNS check in mixed query
MixedDnsTlds:
    - cf
    - ga
    - gr
    - nz
    - ml
    - to
    - com.vn
    - vn
    - co.nz
    - tk
    - es
    - ac.uk
    - de
    - ch
    - pt

## Setting proxy information
SocketProxyHost: ""
SocketProxyPort: 0
SocketProxyAuth: false
SocketProxyUser: ""
SocketProxyPassword: ""

# ------ Bulk check settings ------
BulkCheckConcurrencyLimit: 50

# ------ Web check settings ------
WebCheckConcurrencyLimit: 15
WebCheckDomainLimit: 800

# ------ Typo check settings ------
TypoDefaultCcTlds:
    - Tld: com
      IsSelected: true
    - Tld: net
      IsSelected: true
    - Tld: org
      IsSelected: true
    - Tld: co
      IsSelected: true
    - Tld: de
      IsSelected: false
    - Tld: eu
      IsSelected: false
    - Tld: in
      IsSelected: false

TypoCustomizedReplaces:
    - s2:ss22
    - sa:sal

# ------ Register APIs ------
RegisterApis:

# ------ Whois APIs ------
WhoisApis:

# Supply credentials through POWERWHOIS_ADMIN_* and POWERWHOIS_JWT_SECRET.
RdapTimeout: 10
DnsConcurrency: 15
WhoisConcurrency: 15
RdapConcurrency: 4
DnsRate: 20
WhoisRate: 2
RdapRate: 4
